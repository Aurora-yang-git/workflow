name: Daily News Digest

on:
  schedule:
    # 8:00 AM UTC every day
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Horizon dependencies
        working-directory: Horizon
        run: uv sync

      - name: Prepare config
        working-directory: Horizon
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        working-directory: Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: uv run horizon --hours 24

      - name: Post summary as GitHub Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUMMARY_DIR: Horizon/data/summaries
        run: python scripts/post_issue.py
