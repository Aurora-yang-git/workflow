name: Digest Q&A Responder

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    # Skip: bot comments (loop guard), PR review comments, non-digest issues, non-owner/collaborator comments
    if: |
      github.actor != 'github-actions[bot]' &&
      github.event.issue.pull_request == null &&
      (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'COLLABORATOR' || github.event.comment.author_association == 'MEMBER') &&
      (contains(github.event.issue.title, '每日速递') || contains(github.event.issue.title, 'Daily Digest') || contains(github.event.issue.title, 'Weekly Arc'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Answer question
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python scripts/qa_responder.py
