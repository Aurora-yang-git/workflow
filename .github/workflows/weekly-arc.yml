name: Weekly Arc Digest

on:
  schedule:
    # Sunday 10:00 UTC — after daily digest at 08:00 UTC so memory.json includes Sunday's entries
    - cron: "0 10 * * 0"
  workflow_dispatch:

jobs:
  arc-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run arc digest
        id: arc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}  # Optional — arc_digest.py logs warning and skips if not set
        run: python scripts/arc_digest.py

      - name: Report skip reason
        if: steps.arc.outputs.skipped == 'true'
        run: echo "Arc digest skipped — ${{ steps.arc.outputs.skip_reason }}"
